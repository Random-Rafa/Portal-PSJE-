<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso restrito — Portal PSJE</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/reset.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<svg class="sprite"><defs>
  <symbol id="i-emblem" viewBox="0 0 40 40"><g stroke-width="1.4"><line x1="20" y1="2" x2="20" y2="7"/><line x1="11" y1="6" x2="14" y2="10"/><line x1="29" y1="6" x2="26" y2="10"/></g><circle cx="20" cy="14" r="5" fill="currentColor" stroke="none"/><path d="M4 34 C10 30 15 30 20 33 C25 30 30 30 36 34 L36 36 C30 33 25 33 20 35 C15 33 10 33 4 36 Z"/><line x1="20" y1="33" x2="20" y2="35"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5 5-5.5"/></symbol>
  <symbol id="i-alert-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7.5" x2="12" y2="13"/><circle cx="12" cy="16.3" r="0.6" fill="currentColor" stroke="none"/></symbol>
</defs></svg>

<header class="site-header">
  <div class="wrap header-row">
    <a href="../index.html" class="logo">
      <svg class="icon icon-28 logo-emblem"><use href="#i-emblem"/></svg>
      <span class="logo-text"><span class="parish-tag">Paróquia</span><span class="parish-name">São João Evangelista</span></span>
    </a>
  </div>
</header>

<main id="conteudo">
  <div class="login-wrap">
    <div class="login-card arch">
      <svg class="icon login-icon"><use href="#i-lock"/></svg>
      <h1>Acesso restrito</h1>
      <p>Área destinada aos responsáveis pela comunicação da paróquia, para publicar eventos na agenda.</p>

      <div id="loginStatus" class="form-status" role="status" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginUser">Usuário *</label>
          <input type="text" id="loginUser" autocomplete="username">
          <span class="field-error"><svg class="icon icon-14"><use href="#i-alert-circle"/></svg>Informe o usuário.</span>
        </div>
        <div class="field">
          <label for="loginPass">Senha *</label>
          <input type="password" id="loginPass" autocomplete="current-password">
          <span class="field-error"><svg class="icon icon-14"><use href="#i-alert-circle"/></svg>Informe a senha.</span>
        </div>
        <button type="submit" class="btn btn-gold btn-block">Entrar</button>
      </form>

      <div class="back-link"><a href="../index.html">← Voltar para o site</a></div>
    </div>
  </div>
</main>

<script src="../assets/js/entrar.js"></script>
</body>
</html>
